# Serviços locais de desenvolvimento (opcionais): Postgres e Mailpit.
# Subir: docker compose up -d      Parar: docker compose down      Apagar dados: docker compose down -v
# As credenciais abaixo são só do ambiente local; nunca use em produção.
services:
  postgres:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tempestivo
    ports:
      # 54329 no host para não disputar a porta com um Postgres já instalado na máquina.
      - "127.0.0.1:54329:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tempestivo"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports:
      - "127.0.0.1:54325:1025" # SMTP
      - "127.0.0.1:54380:8025" # caixa de entrada: http://localhost:54380
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dados-postgres:
