name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Valores falsos: o CI nunca recebe segredos.
      APP_URL: http://localhost:3000
      JOBS_SECRET: segredo-falso-so-para-o-ci-0123456789abcdef
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v7.0.1 # 3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Terceiros: fixado por hash de commit. v6.1.0 = ea17c68df8912ef543352723c149a84f56e3d413
      # (a tag v6.1.0 é anotada e aponta para este commit). Instala o pnpm na versão exata
      # do campo "packageManager" do package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7.1.0 # 949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Valores falsos: o CI nunca recebe segredos.
      APP_URL: http://localhost:3100
      JOBS_SECRET: segredo-falso-so-para-o-ci-0123456789abcdef
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v7.0.1 # 3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7.1.0 # 949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

      # O relatório só é anexado quando o e2e falha.
      - uses: actions/upload-artifact@v7.0.2 # cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
