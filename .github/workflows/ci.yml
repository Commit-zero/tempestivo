name: CI

# Qualidade em cada Pull Request e em cada push na main:
#   qualidade  lint, tipos, testes de unidade e de integração (Postgres real), build
#   e2e        Playwright em 360, 768 e 1280 px contra o build de produção
#   imagem     constrói os alvos runner e migrator, aplica as migrações e confere a saúde
#
# Todas as actions estão fixadas por SHA de commit: uma tag pode ser reescrita, um SHA não.
# O CI nunca recebe segredos; os valores abaixo são falsos e só existem aqui.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  JOBS_SECRET: segredo.falso.so.para.o.ci.0123456789.abcdef
  AUTH_SECRET: segredo.falso.de.sessao.so.para.o.ci.0123456789
  DATABASE_URL: postgresql://tempestivo_ci:senha_so_do_ci@localhost:5432/tempestivo_ci

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_URL: http://localhost:3000
      LOG_LEVEL: info
    services:
      # Banco descartável: os testes de integração rodam contra PostgreSQL de verdade,
      # na mesma versão de produção.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tempestivo_ci
          POSTGRES_PASSWORD: senha_so_do_ci
          POSTGRES_DB: tempestivo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tempestivo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Instala o pnpm na versão exata do campo "packageManager" do package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Aplicar as migrações no banco do CI
        run: pnpm prisma migrate deploy

      - name: Conferir que o esquema não tem migração pendente
        # Pega o esquecimento de gerar a migração depois de mudar o schema.prisma.
        run: pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      APP_URL: http://localhost:3100
      LOG_LEVEL: warn
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tempestivo_ci
          POSTGRES_PASSWORD: senha_so_do_ci
          POSTGRES_DB: tempestivo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tempestivo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

      # O relatório só é anexado quando o e2e falha.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  imagem:
    name: imagem
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construir os alvos runner e migrator
        run: |
          docker build --target runner -t tempestivo-ci:local .
          docker build --target migrator -t tempestivo-migrador-ci:local .

      - name: Subir o Postgres, aplicar as migrações e subir o app
        run: |
          docker network create rede-ci
          docker run -d --name banco --network rede-ci \
            -e POSTGRES_USER=tempestivo_ci -e POSTGRES_PASSWORD=senha_so_do_ci -e POSTGRES_DB=tempestivo_ci \
            postgres:17-alpine
          for tentativa in $(seq 1 30); do
            docker exec banco pg_isready -U tempestivo_ci && break
            sleep 2
          done
          URL_DO_BANCO=postgresql://tempestivo_ci:senha_so_do_ci@banco:5432/tempestivo_ci
          docker run --rm --network rede-ci -e DATABASE_URL="$URL_DO_BANCO" tempestivo-migrador-ci:local
          docker run -d --name app --network rede-ci -p 3000:3000 \
            -e DATABASE_URL="$URL_DO_BANCO" -e APP_URL=http://localhost:3000 \
            -e JOBS_SECRET -e AUTH_SECRET \
            tempestivo-ci:local

      - name: Conferir a saúde e o usuário do contêiner
        run: |
          for tentativa in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health | grep -q '"banco":"ok"'
          test "$(docker exec app id -u)" != "0"

      - name: Mostrar o log do app se algo falhar
        if: failure()
        run: docker logs app || true
