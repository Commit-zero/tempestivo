name: Migrar o banco de produção

# Passo manual e separado do deploy: o app nunca roda migração ao subir.
# Segredo necessário: DATABASE_URL_MIGRACAO, uma conexão de sessão (não de transação).
# No Supabase, use o Supavisor em modo sessão (porta 5432 do host *.pooler.supabase.com):
# a conexão direta do plano gratuito é só IPv6, e os runners do GitHub são IPv4.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite "migrar" para aplicar as migrações pendentes em produção'
        required: true

permissions:
  contents: read

concurrency:
  group: migrar-producao
  cancel-in-progress: false

jobs:
  migrar:
    name: prisma migrate deploy
    if: inputs.confirmar == 'migrar'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: producao
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Aplicar as migrações pendentes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRACAO }}
        run: pnpm prisma migrate deploy
